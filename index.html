    <style>

        body{background-color:var(--bg-dark);background-image:radial-gradient(circle at 15% 20%,rgba(139,92,246,.15) 0%,transparent 40%),radial-gradient(circle at 85% 80%,rgba(6,182,212,.15) 0%,transparent 40%),radial-gradient(circle at 50% 50%,rgba(236,72,153,.08) 0%,transparent 60%);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 60px;overflow-x:hidden;position:relative}
        body::before{content:"";position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%259C92AC' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0}

<body>
    <!-- El resto de la interfaz original permanece intacta. -->
    <script>
        // Parche crítico del flujo de ofuscación:
        // jamás guarda el código original cuando el motor Z falla.
        // Esto evita crear scripts “aparentemente ofuscados” que en realidad sean el fuente directo.
        async function zObfuscateOrFail(code) {
            const response = await fetch('https://zprotector.vercel.app/api/obfuscate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            let data;
            try { data = await response.json(); } catch (_) { throw new Error('El motor Z devolvió una respuesta inválida.'); }
            if (!response.ok || !data.success || typeof data.code !== 'string' || !data.code.trim()) {
                throw new Error(data && data.error ? String(data.error) : 'El motor Z no generó una salida válida.');
            }
            return data.code;
        }
        window.zObfuscateOrFail = zObfuscateOrFail;
    </script>
